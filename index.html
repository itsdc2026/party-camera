<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Party Camera</title>
<style>
  :root {
    --bg: #fafaf8;
    --ink: #141414;
    --sub: #7a7a75;
    --line: #e6e6e2;
    --accent: #c8102e;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    overflow: hidden;
  }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; padding: 0; }
  svg { display: block; }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Intro and messages ---------- */
  .center { align-items: center; justify-content: center; text-align: center; padding: 32px; gap: 20px; }
  .eyebrow { margin: 0; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--sub); }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 500; letter-spacing: -.01em; }
  .hero { display: flex; align-items: baseline; gap: 10px; }
  .hero b { font-size: 7.5rem; font-weight: 200; line-height: 1; letter-spacing: -.04em; }
  .hero span { font-size: 1.1rem; color: var(--sub); }
  .lede { margin: 0; max-width: 300px; line-height: 1.6; color: var(--sub); font-size: .95rem; }
  .btn { background: var(--ink); color: #fff; padding: 15px 44px; border-radius: 999px; font-size: 1rem; font-weight: 500; transition: transform .1s; }
  .btn:active { transform: scale(.97); }

  /* ---------- Camera ---------- */
  #camera { position: relative; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  video.mirror { transform: scaleX(-1); }
  .scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
  .scrim.top { top: 0; height: 120px; background: linear-gradient(rgba(0,0,0,.45), transparent); }
  .scrim.bottom { bottom: 0; height: 200px; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.pop { animation: pop .2s ease-out; }
  @keyframes pop { 0% { opacity: .85; } 100% { opacity: 0; } }

  .hud-top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
  .pill { display: flex; align-items: baseline; gap: 6px; padding: 8px 16px; border-radius: 999px; background: rgba(20,20,20,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .pill b { font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pill span { font-size: .8rem; opacity: .8; }
  .saving { display: none; align-items: center; gap: 8px; font-size: .8rem; padding: 8px 14px; border-radius: 999px; background: rgba(20,20,20,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .saving.on { display: flex; }
  .saving i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .hud-bottom { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; align-items: center; justify-content: space-around; padding: 0 24px; color: #fff; }
  .round { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(20,20,20,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; }
  .round.ghost { visibility: hidden; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; }
  #shutter i { width: 62px; height: 62px; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shutter:active i { transform: scale(.88); }
  #shutter:disabled { opacity: .4; }

  /* ---------- Album ---------- */
  #album { background: var(--bg); }
  .album-head { display: flex; justify-content: space-between; align-items: flex-end; padding: 28px 20px 16px; }
  .album-head h2 { margin: 0; font-size: 2rem; font-weight: 300; letter-spacing: -.02em; }
  .album-head p { margin: 4px 0 0; font-size: .85rem; color: var(--sub); }
  .round.dark { background: #ecece8; color: var(--ink); -webkit-backdrop-filter: none; backdrop-filter: none; width: 42px; height: 42px; }
  #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; align-content: start; padding-bottom: 24px; }
  .ph { aspect-ratio: 1; background: #e9e9e5; display: block; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #empty { grid-column: 1 / -1; text-align: center; color: var(--sub); padding: 60px 20px; font-size: .95rem; }
  @media (min-width: 640px) { #grid { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 1000px) { #grid { grid-template-columns: repeat(7, 1fr); } }

  /* ---------- Swipe viewer ---------- */
  #viewer { position: fixed; inset: 0; background: #000; display: none; z-index: 10; touch-action: none; overflow: hidden; user-select: none; -webkit-user-select: none; color: #fff; }
  #viewer.on { display: block; }
  #track { display: flex; width: 300%; height: 100%; transform: translate(-33.3333%, 0); will-change: transform; }
  .slide { width: 33.3333%; flex: none; display: flex; align-items: center; justify-content: center; padding: 64px 0 72px; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; -webkit-user-drag: none; pointer-events: none; }
  .vtop { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  #vcount { font-size: .85rem; letter-spacing: .08em; font-variant-numeric: tabular-nums; opacity: .85; }
  .vbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.1); }
  .vnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }
  #prev { left: 12px; } #next { right: 12px; }
  .vnav:disabled { opacity: .15; }
  .vbottom { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 0; right: 0; text-align: center; z-index: 2; font-size: .8rem; }
  .vbottom a { color: #fff; opacity: .7; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.4); padding-bottom: 1px; }
  @media (max-width: 600px) { .vnav { display: none; } }

  #hold { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; color: #fff;
    background: rgba(10,10,10,.5); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #hold.on { opacity: 1; pointer-events: auto; }
  .hold-card { max-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hold-card h3 { margin: 0; font-size: 1.3rem; font-weight: 500; }
  .hold-card p { margin: 0; font-size: .92rem; line-height: 1.55; opacity: .8; }
  .hold-card small { font-size: .82rem; opacity: .75; font-variant-numeric: tabular-nums; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { width: 200px; height: 3px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; transition: width .4s ease; }

  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 130px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .88rem; display: none; z-index: 20; max-width: 90%; text-align: center; }
  #toast.on { display: block; }

  @media (prefers-reduced-motion: reduce) { #flash.pop, .saving i, .spin { animation: none; } #hold { transition: none; } }
</style>
</head>
<body>

<!-- Loading / message -->
<section id="msg" class="screen center active">
  <h1 id="msgTitle">Loading…</h1>
  <p class="lede" id="msgText"></p>
  <button class="btn" id="msgBtn" style="display:none"></button>
</section>

<!-- Camera -->
<section id="camera" class="screen">
  <video id="video" autoplay playsinline muted></video>
  <div class="scrim top"></div>
  <div class="scrim bottom"></div>
  <div id="flash"></div>
  <div class="hud-top">
    <div class="pill"><b id="left">20</b><span>left</span></div>
    <div class="saving" id="saving"><i></i>Saving</div>
  </div>
  <div class="hud-bottom">
    <button class="round" id="flip" aria-label="Switch camera">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3.5h3.5"/><path d="M4 13a8 8 0 0 0 14.9 3M20 19v-3.5h-3.5"/></svg>
    </button>
    <button id="shutter" aria-label="Take photo"><i></i></button>
    <span class="round ghost"></span>
  </div>
</section>

<!-- Album -->
<section id="album" class="screen">
  <div class="album-head">
    <div><h2>Album</h2><p id="albumCount">Shared by all guests</p></div>
    <button class="round dark" id="refresh" aria-label="Refresh album">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3.5h3.5"/><path d="M4 13a8 8 0 0 0 14.9 3M20 19v-3.5h-3.5"/></svg>
    </button>
  </div>
  <div id="grid"></div>
</section>

<!-- Swipe viewer -->
<div id="viewer" aria-modal="true" role="dialog">
  <div class="vtop">
    <span id="vcount"></span>
    <button class="vbtn" id="closeV" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="track">
    <div class="slide"><img alt=""></div>
    <div class="slide"><img alt="Party photo"></div>
    <div class="slide"><img alt=""></div>
  </div>
  <button class="vbtn vnav" id="prev" aria-label="Previous photo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="vbtn vnav" id="next" aria-label="Next photo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="vbottom"><a id="vsave" target="_blank" rel="noopener">Open original to save</a></div>
</div>

<!-- Shown after the last shot while photos are still uploading -->
<div id="hold" aria-live="polite">
  <div class="hold-card">
    <div class="spin"></div>
    <h3>Still uploading your photos</h3>
    <p>Please wait. Your album opens as soon as everything is saved.</p>
    <div class="bar"><i id="holdBar"></i></div>
    <small id="holdCount"></small>
  </div>
</div>

<div id="toast"></div>
<canvas id="canvas" style="display:none"></canvas>

<script>
// ====== SETTINGS ======
const API_URL = 'https://script.google.com/macros/s/AKfycbxJysyR5dUuTcbQG658smvb4shERG8LIFGFOnUznwm1gzTJfOSUNaCcSKJmcJzZhs_ioA/exec';
// Address of the party laptop (printed when you start server.js). Only works for guests on the party Wi-Fi.
const LAPTOP_URL = 'https://192-168-1-50.local-ip.sh:8443';
const MAX_SIDE = 2048;
const JPEG_QUALITY = 0.85;
const SLOW_MS = 9000;        // a direct upload slower than this counts as slow
const SLOW_STRIKES = 2;      // this many slow uploads in a row moves a Wi-Fi guest to the laptop
const STALL_MS = 20000;      // one upload stuck this long moves a Wi-Fi guest to the laptop at once
// ======================

const $ = id => document.getElementById(id);
let guestId = '', shotsLeft = 0, maxShots = 20;
let stream = null, facing = 'environment';
let queue = [], uploading = false, albumTimer = null;
let photos = [];   // album items: {t: thumbnail, f: full size, o: original}
let relay = false, lan = false, lanCheckedAt = 0, laptopFull = false;
let startUsed = 0, directDone = 0, slowStrikes = 0, lastDirectAt = 0, captured = 0, uploaded = 0;

// ---------- Helpers ----------
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function showMsg(title, text, label, fn) {
  $('msgTitle').textContent = title;
  $('msgText').textContent = text || '';
  const b = $('msgBtn');
  if (label) { b.textContent = label; b.style.display = ''; b.onclick = fn; } else b.style.display = 'none';
  show('msg');
}
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800);
}
function getGuestId() {
  let id = '';
  try { id = localStorage.getItem('party_guest_id') || ''; } catch (e) {}
  if (!id) {
    id = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem('party_guest_id', id); } catch (e) {}
  }
  return id;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const api = params => fetch(API_URL + '?' + new URLSearchParams(params)).then(r => r.json());
const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w;

// ---------- Start ----------
async function init() {
  guestId = getGuestId();
  try {
    const d = await api({ action: 'status', guestId });
    if (!d.ok) throw new Error('status');
    shotsLeft = d.shotsLeft; maxShots = d.max;
  } catch (e) {
    showMsg('Cannot connect', 'Check your internet connection and try again.', 'Try again', () => location.reload());
    return;
  }
  startUsed = maxShots - shotsLeft;
  updateCounter();
  if (shotsLeft <= 0) {
    openAlbum();
    laptopReachable(true).then(ok => { if (ok) loadAlbum(); });
    return;
  }
  await startCamera();
  laptopReachable(true);       // background check, never blocks the camera
}

// Is the party laptop reachable? True only for guests on the party Wi-Fi.
async function laptopReachable(force) {
  if (!force && Date.now() - lanCheckedAt < 15000) return lan;
  lanCheckedAt = Date.now();
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 1800);
    const r = await fetch(LAPTOP_URL + '/api/ping', { signal: ctl.signal });
    clearTimeout(to);
    const d = await r.json();
    lan = !!(d && d.relay);
  } catch (e) { lan = false; }
  return lan;
}

// Move this guest's remaining uploads to the laptop (only possible on the party Wi-Fi)
async function switchToLaptop() {
  if (relay) return true;
  if (laptopFull || !(await laptopReachable(false))) return false;
  try {
    const r = await fetch(LAPTOP_URL + '/api/slot?guestId=' + guestId + '&used=' + (startUsed + directDone));
    const d = await r.json();
    if (d.ok && d.relay) { relay = true; slowStrikes = 0; return true; }
    laptopFull = true;         // laptop is at its limit: stay on direct upload
  } catch (e) {}
  return false;
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 2560 }, height: { ideal: 1440 } },
      audio: false
    });
  } catch (e) {
    showMsg('Camera is blocked',
      'Allow camera access for this page. If you opened the link inside another app (Messenger, Facebook, LINE), open it in Chrome or Safari instead.',
      'Try again', startCamera);
    return;
  }
  const v = $('video');
  v.srcObject = stream;
  v.classList.toggle('mirror', facing === 'user');
  show('camera');
  updateUI();
}

// ---------- Shutter ----------
let audioCtx = null;
function click() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 900;
    g.gain.setValueAtTime(.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .07);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + .08);
  } catch (e) {}
}
function photoName(exp) {
  const d = new Date(), p = n => ('0' + n).slice(-2);
  const stamp = String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  return 'XMAS26_ROLL-' + guestId.slice(-6).toUpperCase() + '_EXP' + p(exp) + 'of' + p(maxShots) + '_' + stamp + '.JPG';
}
function capture() {
  if (shotsLeft <= 0) return;
  const v = $('video');
  if (!v.videoWidth) return;
  const scale = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
  const c = $('canvas');
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(v, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', JPEG_QUALITY);
  const tc = document.createElement('canvas'), ts = 480 / Math.max(c.width, c.height);
  tc.width = Math.round(c.width * ts); tc.height = Math.round(c.height * ts);
  tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
  const thumbData = tc.toDataURL('image/jpeg', 0.7);

  shotsLeft--; captured++;
  click();
  const f = $('flash'); f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
  if (navigator.vibrate) navigator.vibrate(30);

  // the name is made here so a photo that is retried through another route is never saved twice
  queue.push({ name: photoName(maxShots - shotsLeft), data, thumb: thumbData, tries: 0 });
  updateUI();
  pump();
}

// ---------- Upload queue ----------
// Starts with direct upload. On the party Wi-Fi, slow or stuck uploads move over to the laptop.
async function pump() {
  if (uploading) return;
  uploading = true;
  while (queue.length) {
    const item = queue[0];
    const viaLaptop = relay;
    let result = null, stalled = false;
    const t0 = Date.now();
    const ctl = new AbortController();
    const stallMs = (!viaLaptop && !laptopFull && lan) ? STALL_MS : 90000;
    const timer = setTimeout(() => { stalled = true; ctl.abort(); }, stallMs);
    try {
      const r = await fetch(viaLaptop ? LAPTOP_URL + '/api/upload' : API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        signal: ctl.signal,
        body: JSON.stringify(viaLaptop
          ? { guestId, name: item.name, image: item.data, thumb: item.thumb }
          : { guestId, name: item.name, image: item.data })
      });
      result = await r.json();
    } catch (e) { result = null; }
    clearTimeout(timer);
    const took = Date.now() - t0;

    if (result && result.ok) {
      queue.shift(); uploaded++;
      if (!viaLaptop) {
        directDone++; lastDirectAt = Date.now();
        slowStrikes = took > SLOW_MS ? slowStrikes + 1 : 0;
        if (slowStrikes >= SLOW_STRIKES) await switchToLaptop();
      }
    } else if (result && result.error === 'limit') {
      queue.shift(); shotsLeft = 0;
    } else if (viaLaptop) {
      relay = false; laptopFull = true;      // laptop unreachable or full: send the rest straight to Google
      continue;
    } else if (stalled && await switchToLaptop()) {
      continue;                              // retry this same photo through the laptop
    } else {
      item.tries++;
      if (item.tries >= 4) {
        queue.shift(); shotsLeft++; captured--;
        toast('One photo could not be saved. Your shot was returned.');
      } else {
        await sleep(1500 * item.tries);
      }
    }
    updateUI();
  }
  uploading = false;
  updateUI();
}

function updateCounter() {
  $('left').textContent = String(Math.max(0, shotsLeft)).padStart(2, '0');
}
function updateUI() {
  updateCounter();
  $('saving').classList.toggle('on', queue.length > 0);
  $('shutter').disabled = shotsLeft <= 0;
  const holding = shotsLeft <= 0 && queue.length > 0;
  $('hold').classList.toggle('on', holding);
  if (holding) {
    $('holdCount').textContent = uploaded + ' of ' + captured + ' uploaded';
    $('holdBar').style.width = (captured ? Math.round(uploaded / captured * 100) : 0) + '%';
  }
  if (shotsLeft <= 0 && queue.length === 0 && !uploading && $('camera').classList.contains('active')) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    openAlbum();                 // everything is uploaded: open the album automatically
  }
}

// ---------- Album ----------
function viewerOpen() { return $('viewer').classList.contains('on'); }

const abs = u => (u.charAt(0) === '/' ? LAPTOP_URL + u : u);
async function fetchGallery() {
  // On the party Wi-Fi the laptop serves the album (fast). Right after a direct upload, use Google so the newest photos are there.
  if (lan && Date.now() - lastDirectAt > 45000) {
    try {
      const d = await (await fetch(LAPTOP_URL + '/api/gallery')).json();
      if (d.ok) return d.photos.map(p => ({ t: abs(p.t), f: abs(p.f), o: abs(p.o) }));
    } catch (e) {}
  }
  const d = await api({ action: 'gallery' });
  if (!d.ok) throw new Error('gallery');
  return d.photos.map(id => ({ t: thumb(id, 640), f: thumb(id, 2000), o: 'https://drive.google.com/file/d/' + id + '/view' }));
}

async function loadAlbum() {
  if (viewerOpen()) return;                  // do not shuffle photos while someone is swiping
  const grid = $('grid');
  try {
    const list = await fetchGallery();
    if (JSON.stringify(list) === JSON.stringify(photos) && grid.children.length) return;
    photos = list;
    $('albumCount').textContent = photos.length + (photos.length === 1 ? ' photo' : ' photos');
    if (!photos.length) {
      grid.innerHTML = '<div id="empty">No photos yet. Check back in a moment.</div>';
      return;
    }
    grid.innerHTML = '';
    photos.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'ph';
      b.setAttribute('aria-label', 'Open photo ' + (i + 1));
      const img = document.createElement('img');
      img.loading = 'lazy'; img.alt = ''; img.src = p.t;
      b.appendChild(img);
      b.onclick = () => openViewer(i);
      grid.appendChild(b);
    });
  } catch (e) {
    if (!grid.children.length) grid.innerHTML = '<div id="empty">The album could not load. Tap refresh to try again.</div>';
  }
}
function openAlbum() {
  show('album');
  loadAlbum();
  clearInterval(albumTimer);
  albumTimer = setInterval(loadAlbum, 60000);
}

// ---------- Swipe viewer ----------
let vi = 0, busy = false;
const viewer = $('viewer'), track = $('track');

function setPos(x, y, anim) {
  track.style.transition = anim ? 'transform .22s ease-out' : 'none';
  track.style.transform = 'translate(calc(-33.3333% + ' + x + 'px), ' + y + 'px)';
}
function paint() {
  const imgs = track.querySelectorAll('img');
  [vi - 1, vi, vi + 1].forEach((i, k) => {
    const im = imgs[k], p = photos[i];
    if (p) {
      const s = p.f;
      if (im.getAttribute('src') !== s) im.src = s;
      im.style.visibility = 'visible';
    } else {
      im.removeAttribute('src'); im.style.visibility = 'hidden';
    }
  });
  $('vcount').textContent = (vi + 1) + ' / ' + photos.length;
  $('vsave').href = photos[vi].o;
  $('prev').disabled = vi <= 0;
  $('next').disabled = vi >= photos.length - 1;
}
function openViewer(i) {
  vi = i; busy = false;
  viewer.classList.add('on');
  setPos(0, 0, false);
  paint();
}
function closeViewer() {
  viewer.classList.remove('on');
  track.querySelectorAll('img').forEach(im => im.removeAttribute('src'));
}
function go(dir) {
  const n = vi + dir;
  if (busy || n < 0 || n >= photos.length) { setPos(0, 0, true); return; }
  busy = true;
  setPos(-dir * viewer.clientWidth, 0, true);
  setTimeout(() => { vi = n; paint(); setPos(0, 0, false); busy = false; }, 230);
}

let sx = 0, sy = 0, dx = 0, dy = 0, axis = null, dragging = false;
viewer.addEventListener('pointerdown', e => {
  if (busy || e.target.closest('button, a')) return;
  dragging = true; axis = null; dx = dy = 0; sx = e.clientX; sy = e.clientY;
  viewer.setPointerCapture(e.pointerId);
});
viewer.addEventListener('pointermove', e => {
  if (!dragging) return;
  let mx = e.clientX - sx, my = e.clientY - sy;
  if (!axis && (Math.abs(mx) > 8 || Math.abs(my) > 8)) axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
  if (axis === 'x') {
    if ((vi === 0 && mx > 0) || (vi === photos.length - 1 && mx < 0)) mx /= 3;   // soft stop at the ends
    dx = mx; setPos(dx, 0, false);
  } else if (axis === 'y') {
    dy = Math.max(0, my); setPos(0, dy, false);
  }
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (axis === 'x') {
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); else setPos(0, 0, true);
  } else if (axis === 'y') {
    if (dy > 110) closeViewer(); else setPos(0, 0, true);
  }
}
viewer.addEventListener('pointerup', endDrag);
viewer.addEventListener('pointercancel', endDrag);

$('closeV').onclick = closeViewer;
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (!viewerOpen()) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'Escape') closeViewer();
});

// ---------- Events ----------
$('shutter').onclick = capture;
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };
$('refresh').onclick = loadAlbum;
window.addEventListener('beforeunload', e => { if (queue.length) { e.preventDefault(); e.returnValue = ''; } });

init();
</script>
</body>
