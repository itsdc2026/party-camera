<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Party Camera</title>
<style>
  :root {
    --pine: #12301f;
    --pine-deep: #0a1c12;
    --cranberry: #b3202f;
    --brass: #e2b659;
    --snow: #f4f7f2;
    --muted: #9fb5a6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--pine-deep);
    color: var(--snow);
    font-family: "Trebuchet MS", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    overflow: hidden;
  }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Intro ---------- */
  #intro, #msg { align-items: center; justify-content: center; text-align: center; padding: 28px; gap: 18px; background: radial-gradient(120% 80% at 50% 0%, var(--pine) 0%, var(--pine-deep) 70%); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2.1rem; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .company { color: var(--brass); font-size: 1rem; margin: 0; }
  .rules { max-width: 330px; color: var(--muted); line-height: 1.55; margin: 0; }
  .big-count { font-family: Georgia, serif; font-size: 5rem; color: var(--brass); line-height: 1; margin: 6px 0 0; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn { background: var(--cranberry); color: #fff; padding: 15px 34px; border-radius: 999px; font-size: 1.05rem; font-weight: 700; }
  .btn:focus-visible, .icon-btn:focus-visible, #shutter:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  .btn.ghost { background: transparent; border: 2px solid var(--brass); color: var(--brass); }

  /* ---------- Camera ---------- */
  #camera { background: #000; position: relative; }
  #stage { position: relative; flex: 1; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  video.mirror { transform: scaleX(-1); }
  .corner { position: absolute; width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.75); pointer-events: none; }
  .corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.pop { animation: pop .22s ease-out; }
  @keyframes pop { 0% { opacity: .9; } 100% { opacity: 0; } }

  .counter {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(10,28,18,.82); border: 2px solid var(--brass); color: var(--brass);
    border-radius: 12px; padding: 6px 18px; text-align: center; min-width: 108px;
  }
  .counter b { display: block; font-family: Georgia, serif; font-size: 2rem; line-height: 1; }
  .counter span { font-size: .78rem; color: var(--snow); }
  #saving { position: absolute; top: 14px; right: 14px; background: rgba(10,28,18,.82); border-radius: 999px; padding: 6px 12px; font-size: .8rem; color: var(--muted); display: none; }
  #saving.on { display: block; }

  .bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px 20px; background: var(--pine-deep); }
  #shutter { width: 78px; height: 78px; border-radius: 50%; background: var(--cranberry); border: 5px solid var(--snow); box-shadow: 0 0 0 4px var(--cranberry); transition: transform .08s; }
  #shutter:active { transform: scale(.92); }
  #shutter:disabled { opacity: .4; }
  .icon-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--pine); color: var(--snow); font-size: 1.4rem; }
  .spacer { width: 52px; }

  /* ---------- Album ---------- */
  #album { background: var(--pine-deep); }
  .album-head { padding: 18px 18px 10px; text-align: center; background: linear-gradient(var(--pine), var(--pine-deep)); }
  .album-head h2 { font-family: Georgia, serif; margin: 0 0 4px; font-size: 1.5rem; }
  .album-head p { margin: 0; color: var(--muted); font-size: .9rem; }
  .toolbar { display: flex; justify-content: center; gap: 10px; padding: 6px 0 12px; }
  .toolbar .btn { padding: 9px 20px; font-size: .9rem; }
  #grid { flex: 1; overflow-y: auto; padding: 4px 6px 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; align-content: start; }
  #grid img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--pine); display: block; cursor: pointer; }
  #empty { color: var(--muted); text-align: center; padding: 40px 20px; grid-column: 1 / -1; }
  @media (min-width: 700px) { #grid { grid-template-columns: repeat(5, 1fr); } }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; align-items: center; justify-content: center; z-index: 10; }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #lightbox button { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; }

  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 130px); transform: translateX(-50%); background: var(--snow); color: var(--pine-deep); padding: 10px 18px; border-radius: 10px; font-size: .9rem; display: none; z-index: 20; max-width: 90%; text-align: center; }
  #toast.on { display: block; }

  @media (prefers-reduced-motion: reduce) { #flash.pop { animation: none; } }
</style>
</head>
<body>

<!-- Loading / message screen -->
<section id="msg" class="screen active">
  <h1 id="msgTitle">Loading…</h1>
  <p class="rules" id="msgText"></p>
  <button class="btn" id="msgBtn" style="display:none"></button>
</section>

<!-- Intro -->
<section id="intro" class="screen">
  <p class="company" id="companyName"></p>
  <h1>Christmas Party Camera</h1>
  <p class="big-count" id="introCount">20</p>
  <p class="rules">That's how many shots you get. Make each one count. When your film runs out, you can browse the album of everyone's photos.</p>
  <button class="btn" id="startBtn">Start camera</button>
</section>

<!-- Camera -->
<section id="camera" class="screen">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="counter"><b id="left">20</b><span>shots left</span></div>
    <div id="saving">Saving photos…</div>
    <div id="flash"></div>
  </div>
  <div class="bar">
    <span class="spacer"></span>
    <button id="shutter" aria-label="Take photo"></button>
    <button class="icon-btn" id="flip" aria-label="Switch camera">&#8635;</button>
  </div>
</section>

<!-- Album -->
<section id="album" class="screen">
  <div class="album-head">
    <h2>The party album</h2>
    <p id="albumNote">Photos taken by all our guests</p>
  </div>
  <div class="toolbar"><button class="btn ghost" id="refresh">Refresh album</button></div>
  <div id="grid"></div>
</section>

<div id="lightbox"><button class="icon-btn" id="closeLb" aria-label="Close">&#10005;</button><img id="lbImg" alt="Party photo"></div>
<div id="toast"></div>
<canvas id="canvas" style="display:none"></canvas>

<script>
// ====== SETTINGS - EDIT THESE ======
const API_URL = 'https://script.google.com/macros/s/AKfycbxJysyR5dUuTcbQG658smvb4shERG8LIFGFOnUznwm1gzTJfOSUNaCcSKJmcJzZhs_ioA/exec';   // ends with /exec
const COMPANY = 'SDC Global Choice Corp.';        // shown on the intro screen
const MAX_SIDE = 1280;                            // photo size in pixels
const JPEG_QUALITY = 0.72;
// ===================================

const $ = id => document.getElementById(id);
let guestId = '';
let shotsLeft = 0;
let maxShots = 20;
let stream = null;
let facing = 'environment';
let queue = [];
let uploading = false;
let albumTimer = null;

// ---------- Helpers ----------
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function showMsg(title, text, btnLabel, btnFn) {
  $('msgTitle').textContent = title;
  $('msgText').textContent = text || '';
  const b = $('msgBtn');
  if (btnLabel) { b.textContent = btnLabel; b.style.display = ''; b.onclick = btnFn; }
  else b.style.display = 'none';
  show('msg');
}
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800);
}
function getGuestId() {
  let id = '';
  try { id = localStorage.getItem('party_guest_id') || ''; } catch (e) {}
  if (!id) {
    id = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem('party_guest_id', id); } catch (e) {}
  }
  return id;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function api(params) {
  const qs = new URLSearchParams(params).toString();
  return fetch(API_URL + '?' + qs).then(r => r.json());
}

// ---------- Start ----------
async function init() {
  $('companyName').textContent = COMPANY;
  if (API_URL.indexOf('PASTE_') === 0) {
    showMsg('Setup needed', 'Add your Web App URL to API_URL in index.html.');
    return;
  }
  guestId = getGuestId();
  try {
    const d = await api({ action: 'status', guestId });
    if (!d.ok) throw new Error('status');
    shotsLeft = d.shotsLeft; maxShots = d.max;
  } catch (e) {
    showMsg('Cannot connect', 'Check your internet connection and try again.', 'Try again', () => location.reload());
    return;
  }
  if (shotsLeft <= 0) { openAlbum(); return; }
  $('introCount').textContent = shotsLeft;
  $('left').textContent = shotsLeft;
  show('intro');
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (e) {
    showMsg('Camera is blocked',
      'Allow camera access for this page. If you opened the link inside another app (Messenger, Facebook, LINE), open it in Chrome or Safari instead.',
      'Try again', startCamera);
    return;
  }
  const v = $('video');
  v.srcObject = stream;
  v.classList.toggle('mirror', facing === 'user');
  show('camera');
  updateUI();
}

// ---------- Shutter ----------
let audioCtx = null;
function click() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 1400;
    g.gain.setValueAtTime(.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .06);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + .07);
  } catch (e) {}
}

function capture() {
  if (shotsLeft <= 0) return;
  const v = $('video');
  if (!v.videoWidth) return;
  const scale = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
  const c = $('canvas');
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', JPEG_QUALITY);

  shotsLeft--;
  click();
  const f = $('flash'); f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
  if (navigator.vibrate) navigator.vibrate(30);

  queue.push({ data, tries: 0 });
  updateUI();
  pump();
}

// ---------- Upload queue ----------
async function pump() {
  if (uploading) return;
  uploading = true;
  while (queue.length) {
    const item = queue[0];
    let result = null;
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // avoids CORS preflight
        body: JSON.stringify({ guestId, image: item.data })
      });
      result = await r.json();
    } catch (e) { result = null; }

    if (result && result.ok) {
      queue.shift();
    } else if (result && result.error === 'limit') {
      queue.shift(); shotsLeft = 0;
    } else {
      item.tries++;
      if (item.tries >= 4) {
        queue.shift(); shotsLeft++;           // give the shot back
        toast('One photo could not be saved. Your shot was returned.');
      } else {
        await sleep(1500 * item.tries);
      }
    }
    updateUI();
  }
  uploading = false;
  updateUI();
}

function updateUI() {
  $('left').textContent = Math.max(0, shotsLeft);
  $('saving').classList.toggle('on', queue.length > 0);
  $('shutter').disabled = shotsLeft <= 0;
  if (shotsLeft <= 0 && queue.length === 0 && $('camera').classList.contains('active')) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    toast('Film finished! Here is the album.');
    openAlbum();
  }
}

// ---------- Album ----------
async function loadAlbum() {
  const grid = $('grid');
  try {
    const d = await api({ action: 'gallery' });
    if (!d.ok) throw new Error('gallery');
    if (!d.photos.length) {
      grid.innerHTML = '<div id="empty">No photos yet. Check back in a moment.</div>';
      return;
    }
    grid.innerHTML = '';
    d.photos.forEach(id => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = 'Party photo';
      img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400';
      img.onclick = () => openLightbox(id);
      grid.appendChild(img);
    });
  } catch (e) {
    grid.innerHTML = '<div id="empty">The album could not load. Tap Refresh album.</div>';
  }
}
function openAlbum() {
  show('album');
  loadAlbum();
  clearInterval(albumTimer);
  albumTimer = setInterval(loadAlbum, 60000);
}
function openLightbox(id) {
  $('lbImg').src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600';
  $('lightbox').classList.add('on');
}

// ---------- Events ----------
$('startBtn').onclick = startCamera;
$('shutter').onclick = capture;
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };
$('refresh').onclick = loadAlbum;
$('closeLb').onclick = () => { $('lightbox').classList.remove('on'); $('lbImg').src = ''; };
window.addEventListener('beforeunload', e => { if (queue.length) { e.preventDefault(); e.returnValue = ''; } });

init();
</script>
</body>
</html>
